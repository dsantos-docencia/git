<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="Git e as plataformas GitHub, GitLab e Bitbucket">
<title>Git e as plataformas GitHub, GitLab e Bitbucket</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="350" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Git é a ferramenta · GitHub, GitLab e Bitbucket são plataformas</text><rect x="330" y="60" width="220" height="90" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="440.0" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">🌿 Git</text><text x="440.0" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">controle de versão distribuído</text><text x="440.0" y="128" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#64748b">roda no SEU computador</text><rect x="40" y="220" width="240" height="80" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="160.0" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">🐙 GitHub</text><text x="160.0" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Microsoft · maior comunidade</text><path d="M440 150 L160 218" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/><rect x="330" y="220" width="240" height="80" rx="12" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="450.0" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">🦊 GitLab</text><text x="450.0" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">DevSecOps · pode ser auto-hospedado</text><path d="M440 150 L450 218" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/><text x="445.0" y="180.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a">git push / pull</text><rect x="620" y="220" width="240" height="80" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="740.0" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">🪣 Bitbucket</text><text x="740.0" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Atlassian · integra com Jira</text><path d="M440 150 L740 218" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/><text x="440" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">As plataformas hospedam repositórios Git e somam: Pull/Merge Requests, CI/CD, issues, permissões e revisão de código.</text>
<text x="866" y="340" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
