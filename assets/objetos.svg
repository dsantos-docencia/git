<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Objetos do Git: commit, tree e blob">
<title>Objetos do Git: commit, tree e blob</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="380" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Por dentro: tudo é objeto endereçado pelo hash do conteúdo</text><rect x="20.0" y="76" width="140" height="26" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="90" y="94" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">refs/heads/main</text><path d="M90 104 L90 138" stroke="#2563eb" stroke-width="2" fill="none"  marker-end="url(#s)"/><rect x="20" y="140" width="150" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="95.0" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">commit</text><text x="95.0" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">autor, data, msg</text><text x="95.0" y="208" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5"  fill="#64748b">tree + parent</text><path d="M170 180 L248 180" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><rect x="250" y="140" width="150" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="325.0" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">tree</text><text x="325.0" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">a pasta raiz</text><text x="325.0" y="208" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5"  fill="#64748b">nomes → hashes</text><path d="M400 165 L478 120" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><path d="M400 195 L478 240" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><rect x="480" y="80" width="150" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="555.0" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">blob</text><text x="555.0" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">README.md</text><text x="555.0" y="148" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5"  fill="#64748b">só o conteúdo</text><rect x="480" y="205" width="150" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="555.0" y="233" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">tree</text><text x="555.0" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">src/</text><path d="M630 240 L708 240" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><rect x="710" y="205" width="150" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="785.0" y="233" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">blob</text><text x="785.0" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">app.py</text><path d="M95 220 L95 290" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s)"/><rect x="20" y="292" width="150" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="95.0" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">commit pai</text><text x="440" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5"  fill="#334155">Mesmo conteúdo = mesmo hash = guardado uma vez só. Mudar um byte muda o hash de tudo acima.</text><text x="440" y="352" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">git cat-file -p HEAD  ·  git cat-file -p HEAD^{tree}  ·  git hash-object arquivo</text>
