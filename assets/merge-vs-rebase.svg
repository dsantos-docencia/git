<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Merge versus rebase">
<title>Merge versus rebase</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="320" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Integrar uma feature: merge × rebase</text><text x="30" y="70" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">merge — preserva a história como aconteceu</text><circle cx="70" cy="130" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="70" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C1</text><circle cx="170" cy="130" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="170" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C2</text><path d="M150 130 L90 130" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="270" cy="130" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="270" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C3</text><path d="M250 130 L190 130" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="270" cy="90" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="270" y="95" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F1</text><path d="M252 98 L188 122" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="370" cy="90" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="370" y="95" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F2</text><path d="M350 90 L290 90" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="470" cy="130" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="470" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">M</text><path d="M450 130 L290 130" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><path d="M452 122 L388 98" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><text x="30" y="195" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">rebase — reescreve F1, F2 como F1′, F2′ sobre a main: história linear</text><circle cx="70" cy="250" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="70" y="255" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C1</text><circle cx="170" cy="250" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="170" y="255" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C2</text><path d="M150 250 L90 250" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="270" cy="250" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="270" y="255" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C3</text><path d="M250 250 L190 250" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="370" cy="250" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="370" y="255" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F1′</text><path d="M350 250 L290 250" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="470" cy="250" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="470" y="255" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F2′</text><path d="M450 250 L390 250" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><text x="540" y="90" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#0f172a">✔ não reescreve nada</text><text x="540" y="110" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#0f172a">✔ seguro em branch compartilhada</text><text x="540" y="130" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#0f172a">✖ histórico com "bolhas"</text><text x="540" y="240" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#0f172a">✔ histórico linear e legível</text><text x="540" y="260" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#0f172a">✖ cria commits NOVOS (hashes novos)</text><text x="540" y="280" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#b91c1c">⚠ nunca em commits já publicados</text>
<text x="866" y="310" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
