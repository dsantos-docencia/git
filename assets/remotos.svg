<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="Repositório local, origin e upstream">
<title>Repositório local, origin e upstream</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="410" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Remotos: seu repositório, o origin e o upstream</text><rect x="40" y="70" width="240" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="160.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">🏢 upstream</text><text x="160.0" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">repositório original</text><text x="160.0" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5"  fill="#64748b">github.com/org/projeto</text><rect x="600" y="70" width="240" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">☁️ origin</text><text x="720.0" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">o SEU fork / o servidor</text><text x="720.0" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5"  fill="#64748b">github.com/voce/projeto</text><rect x="320" y="250" width="240" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="440.0" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">💻 seu repositório local</text><text x="440.0" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#334155">main · origin/main · upstream/main</text><text x="440.0" y="318" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5"  fill="#64748b">.git no seu computador</text><path d="M160 160 L350 248" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><text x="190" y="215" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">git fetch upstream</text><path d="M530 248 L700 162" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><text x="640" y="215" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">git push</text><path d="M680 162 L500 248" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#s)"/><text x="470" y="200" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#1d4ed8">git fetch / pull</text><path d="M280 110 L598 110" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#s)"/><text x="440" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"  fill="#6d28d9">fork (na plataforma)</text><text x="440" y="385" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5"  fill="#334155">fetch = só baixa e atualiza origin/main · pull = fetch + merge (ou rebase) · push = envia seus commits</text>
<text x="866" y="400" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
