<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Mapa de como desfazer no Git">
<title>Mapa de como desfazer no Git</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="380" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Como desfazer — escolha pela pergunta “já publiquei?”</text><rect x="30" y="60" width="400" height="80" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="46" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Mudança no arquivo, sem add</text><text x="46" y="108" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">git restore arquivo</text><text x="46" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">descarta a edição</text><rect x="450" y="60" width="400" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="466" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Já fiz add, não quero commitar</text><text x="466" y="108" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">git restore --staged arquivo</text><text x="466" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">tira da preparação, mantém a edição</text><rect x="30" y="152" width="400" height="80" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="46" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Último commit errado, não publicado</text><text x="46" y="200" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">git commit --amend</text><text x="46" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">reescreve o último commit</text><rect x="450" y="152" width="400" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="466" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Commits locais, não publicados</text><text x="466" y="200" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">git reset --soft|--mixed|--hard</text><text x="466" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">move a branch para trás</text><rect x="30" y="244" width="400" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="46" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Commit já publicado</text><text x="46" y="292" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">git revert &lt;commit&gt;</text><text x="46" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">cria um commit que desfaz — seguro</text><rect x="450" y="244" width="400" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="466" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">“Perdi” um commit ou branch</text><text x="466" y="292" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">git reflog</text><text x="466" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">encontra e recupera</text><text x="440" y="356" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b91c1c">Regra de ouro: não reescreva (amend, reset, rebase) o que outras pessoas já baixaram.</text>
<text x="866" y="370" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
