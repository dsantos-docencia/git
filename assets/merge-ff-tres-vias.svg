<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="Merge por avanço rápido e merge de três vias">
<title>Merge por avanço rápido e merge de três vias</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="370" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Merge: avanço rápido × merge de três vias</text><text x="30" y="70" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Avanço rápido (fast-forward): a main não andou — ela só "pula" para frente</text><circle cx="70" cy="115" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="70" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C1</text><circle cx="170" cy="115" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="170" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C2</text><path d="M150 115 L90 115" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="270" cy="115" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="270" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C3</text><path d="M250 115 L190 115" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="370" cy="115" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="370" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F1</text><path d="M350 115 L290 115" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="470" cy="115" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="470" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F2</text><path d="M450 115 L390 115" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><rect x="212.0" y="146" width="116" height="26" rx="7" fill="#f1f5f9" stroke="#94a3b8"/><text x="270" y="164" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">main (antes)</text><rect x="404.0" y="146" width="132" height="26" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="470" y="164" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">main = feature</text><path d="M270 147 L450 130" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s)"/><text x="560" y="120" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">git merge feature  →  nenhum commit novo</text><text x="30" y="215" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Merge de três vias: as duas linhas andaram — nasce um commit de merge (M) com dois pais</text><circle cx="70" cy="290" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="70" y="295" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C1</text><circle cx="170" cy="290" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="170" y="295" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C2</text><path d="M150 290 L90 290" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="270" cy="290" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="270" y="295" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C3</text><path d="M250 290 L190 290" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="370" cy="290" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="370" y="295" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">C4</text><path d="M350 290 L290 290" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="370" cy="245" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="370" y="250" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F1</text><path d="M352 253 L288 280" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="470" cy="245" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/><text x="470" y="250" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">F2</text><path d="M450 245 L390 245" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><circle cx="570" cy="290" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="570" y="295" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">M</text><path d="M550 290 L390 290" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><path d="M552 280 L488 253" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#s)"/><rect x="544.0" y="321" width="52" height="26" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="570" y="339" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">main</text><rect x="512.0" y="232" width="76" height="26" rx="7" fill="#fef9c3" stroke="#ca8a04"/><text x="550" y="250" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">feature</text><text x="640" y="280" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">ancestral comum = C3</text><text x="640" y="300" text-anchor="start" font-family="Consolas, Menlo, monospace" font-size="12"  fill="#0f172a">pais do M = C4 e F2</text>
