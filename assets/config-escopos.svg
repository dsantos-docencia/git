<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="Níveis de configuração do Git">
<title>Níveis de configuração do Git</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="350" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Níveis de configuração — o mais específico vence</text><rect x="30" y="60" width="820" height="48" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="46" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">system</text><text x="160" y="81" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">todos os usuários da máquina</text><text x="160" y="98" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#475569">git config --system  →  /etc/gitconfig · C:\Program Files\Git\etc\gitconfig</text><rect x="60" y="118" width="760" height="48" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="76" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">global</text><text x="190" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">o seu usuário</text><text x="190" y="156" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#475569">git config --global  →  ~/.gitconfig</text><rect x="90" y="176" width="700" height="48" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="106" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">local</text><text x="220" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">um repositório</text><text x="220" y="214" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#475569">git config --local  →  .git/config</text><rect x="120" y="234" width="640" height="48" rx="10" fill="#fef9c3" stroke="#94a3b8"/><text x="136" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">worktree / -c</text><text x="250" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">um comando ou árvore de trabalho</text><text x="250" y="272" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#475569">git -c chave=valor …  →  linha de comando</text><text x="440" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Veja de onde vem cada valor:  </text><text x="440" y="330" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a">git config --list --show-origin --show-scope</text>
<text x="866" y="340" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
