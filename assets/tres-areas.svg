<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-label="As três áreas do Git: diretório de trabalho, área de preparação e repositório">
<title>As três áreas do Git: diretório de trabalho, área de preparação e repositório</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="270" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">As três áreas do Git</text><rect x="30" y="70" width="220" height="110" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="140.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">📝 Diretório de trabalho</text><text x="140.0" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">working tree</text><text x="140.0" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#64748b">arquivos que você edita</text><rect x="330" y="70" width="220" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="440.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">📦 Área de preparação</text><text x="440.0" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">staging area / index</text><text x="440.0" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#64748b">o que vai no próximo commit</text><rect x="630" y="70" width="220" height="110" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="740.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">🗄️ Repositório</text><text x="740.0" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">.git (histórico)</text><text x="740.0" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#64748b">commits permanentes</text><path d="M250 110 L330 110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/><text x="290.0" y="102.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a">git add</text><path d="M550 110 L630 110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/><text x="590.0" y="102.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a">git commit</text><path d="M740 180 C740 250 140 250 140 182" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s)"/><text x="440" y="242" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a">git switch / git restore  (traz versões de volta)</text><path d="M440 180 C440 215 160 215 160 182" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#s)"/><text x="300" y="206" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#475569">git restore --staged</text>
<text x="866" y="260" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
