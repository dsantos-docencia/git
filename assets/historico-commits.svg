<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Histórico de commits, branch main e HEAD">
<title>Histórico de commits, branch main e HEAD</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="880" height="260" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Histórico: uma corrente de commits (cada um aponta para o pai)</text><circle cx="90" cy="130" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="90" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">C1</text><circle cx="230" cy="130" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="230" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">C2</text><path d="M204 130 L119 130" stroke="#475569" stroke-width="2" marker-end="url(#s)"/><circle cx="370" cy="130" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="370" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">C3</text><path d="M344 130 L259 130" stroke="#475569" stroke-width="2" marker-end="url(#s)"/><circle cx="510" cy="130" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="510" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">C4</text><path d="M484 130 L399 130" stroke="#475569" stroke-width="2" marker-end="url(#s)"/><circle cx="650" cy="130" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="650" y="135" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">C5</text><path d="M624 130 L539 130" stroke="#475569" stroke-width="2" marker-end="url(#s)"/><text x="90" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">HEAD~4</text><text x="230" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">HEAD~3</text><text x="370" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">HEAD~2</text><text x="510" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">HEAD~1 = HEAD^</text><text x="650" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">HEAD</text><rect x="720" y="72" width="90" height="30" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="765" y="92" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">main</text><path d="M720 92 L678 118" stroke="#2563eb" stroke-width="2" marker-end="url(#s)"/><rect x="720" y="28" width="90" height="30" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="765" y="48" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">HEAD</text><path d="M765 58 L765 70" stroke="#ca8a04" stroke-width="2" marker-end="url(#s)"/><text x="440" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Uma branch é só um ponteiro para um commit. HEAD aponta para a branch em que você está.</text>
